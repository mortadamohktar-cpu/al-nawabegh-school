
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة النوابغ الخاصة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6f5;color:#243b39}
header{background:#176b63;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0}
.container{padding:18px;max-width:1100px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0000000c}
.card h3{margin:0 0 12px;font-size:15px;color:#54706c}
.number{font-size:26px;font-weight:bold;color:#176b63}
nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
nav button{border:0;background:white;padding:20px 8px;border-radius:12px;font-size:16px;color:#176b63;box-shadow:0 2px 8px #0000000c}
nav button:active{background:#dcefeb}
#content{background:white;border-radius:12px;padding:20px;margin-top:20px;min-height:150px}
footer{text-align:center;color:#70817e;padding:24px;font-size:13px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}nav{grid-template-columns:repeat(4,1fr)}}
</style>
<style>
:root {
  --burgundy: #641F32;
  --black: #101114;
  --gold: #C9A34A;
  --ivory: #F4F0E9;
}

body {
  background: var(--black);
  color: var(--ivory);
  font-family: Arial, sans-serif;
}

button {
  background: var(--burgundy);
  color: var(--ivory);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 12px 22px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  background: var(--gold);
  color: var(--black);
  transform: translateY(-3px);
  box-shadow: 0 5px 20px #C9A34A55;
}

* {
  box-sizing: border-box;
}

.gold {
  color: var(--gold);
}

.card {
  background: #1B1B20;
  border: 1px solid #C9A34A55;
  border-radius: 16px;
  transition: 0.3s ease;
  animation: appear 0.8s ease both;
}

.card:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
}

input {
  background: #242329;
  color: var(--ivory);
  border: 1px solid #C9A34A77;
  border-radius: 10px;
  padding: 12px;
}

input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 12px #C9A34A55;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  body {
    font-size: 14px;
  }
}
</style>
</head>
<body>
<header>
<h1>مدرسة النوابغ الخاصة</h1>
<p>تربية راشدة وتعليم متكامل</p>
</header>
<main class="container">
<h2>لوحة التحكم الرئيسية</h2>
<section class="stats">
<div class="card"><h3>الطلاب</h3><div class="number">0</div></div>
<div class="card"><h3>المعلمون</h3><div class="number">0</div></div>
<div class="card"><h3>الفصول</h3><div class="number">0</div></div>
<div class="card"><h3>الحضور اليوم</h3><div class="number">0</div></div>
</section>
<nav>
<button onclick="openSection('الطلاب')">👨‍🎓 إدارة الطلاب</button>
<button onclick="openSection('المعلمون')">👨‍🏫 إدارة المعلمين</button>
<button onclick="openSection('الفصول')">🏫 الفصول الدراسية</button>
<button onclick="openSection('المواد')">📚 المواد الدراسية</button>
<button onclick="openSection('الحضور والغياب')">📋 الحضور والغياب</button>
<button onclick="openSection('الامتحانات')">📝 الامتحانات</button>
<button onclick="openSection('النتائج')">📊 النتائج</button>
<button onclick="openSection('الحسابات')">💰 الحسابات</button>
<button onclick="openSection('الواجبات')">✏️ الواجبات</button>
<button onclick="openSection('الإعلانات')">📢 الإعلانات</button>
<button onclick="openSection('أولياء الأمور')">👪 أولياء الأمور</button>
<button onclick="openSection('التقارير')">📈 التقارير</button>
</nav>
<section id="content">
<h3>مرحباً بك في نظام إدارة مدرسة النوابغ</h3>
<p>اختر أحد الأقسام للبدء.</p>
</section>
</main>
<footer>مدرسة النوابغ الخاصة © جميع الحقوق محفوظة</footer>
<script>
function openSection(name){
document.getElementById('content').innerHTML=
'<h3>قسم '+name+'</h3><p>سيتم تجهيز وظائف هذا القسم وربطه بقاعدة البيانات في المراحل القادمة.</p>';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

</body>
</html>
